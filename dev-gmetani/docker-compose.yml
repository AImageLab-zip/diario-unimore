networks:
  internal_net:
    driver: bridge
    internal: true      # Django <-> MySQL, nessuna uscita
  external_net:
    driver: bridge      # solo Django, per le API Google

services:
  diario-dev-gmetani:
    build: .
    container_name: diario-dev-gmetani
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8080"
    ports:
      - "8101:8080"
    networks:
      - internal_net
      - external_net
    depends_on:
      - db-dev-gmetani

  db-dev-gmetani:
    image: mysql:8
    container_name: db-dev-gmetani
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal_net    # SOLO questa: il DB non esce su internet

  diario-watcher-dev-gmetani:
    build: .
    container_name: diario-watcher-dev-gmetani
    restart: unless-stopped
    env_file:
      - .env
    command: python manage.py run_watcher --interval 1
    networks:
      - internal_net
      - external_net
    depends_on:
      - db-dev-gmetani

volumes:
  mysql_data: